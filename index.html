<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>내 주식·자산 대시보드</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #f2f4f6;
      word-break: keep-all;
      overflow-x: hidden;
    }
    .color-up { color: #f04452; }
    .color-down { color: #3182f6; }
    .bg-up-light { background-color: #fef0f1; }
    .bg-down-light { background-color: #f0f6ff; }
    @keyframes flash-up {
      0% { background-color: rgba(240, 68, 82, 0.22); }
      100% { background-color: transparent; }
    }
    @keyframes flash-down {
      0% { background-color: rgba(49, 130, 246, 0.22); }
      100% { background-color: transparent; }
    }
    .tick-up { animation: flash-up 0.8s ease-out; }
    .tick-down { animation: flash-down 0.8s ease-out; }
    #chartCustomTooltip {
      pointer-events: none;
      position: absolute;
      transition: all 0.12s ease-out;
      transform: translate(-50%, -125%);
      z-index: 40;
    }
    #chartCustomTooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #191f28 transparent transparent transparent;
    }
  </style>
</head>
<body class="flex justify-center min-h-screen text-[#191f28] antialiased">

  <div class="w-full max-w-6xl min-h-screen bg-[#f4f6f8] pb-24 flex flex-col relative shadow-md">

    <!-- 상단 고정 헤더 -->
    <header class="sticky top-0 z-30 bg-[#f4f6f8]/95 backdrop-blur-md px-4 sm:px-6 pt-4 pb-3 flex flex-wrap items-center justify-between gap-2 border-b border-gray-200/50">
      <div class="flex items-center gap-2">
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-[#191f28] whitespace-nowrap">내 주식·자산</h1>
        <span id="wsStatusDot" class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0" title="실시간 웹소켓 정상"></span>
      </div>
      
      <div class="flex items-center gap-1.5 flex-wrap">
        <button onclick="toggleCurrency()" class="flex items-center gap-1 bg-white border border-gray-200 px-2.5 py-1.5 rounded-full text-xs font-bold text-gray-700 shadow-xs hover:bg-gray-50 active:scale-95 transition whitespace-nowrap">
          <i class="ph ph-currency-dollar text-sm text-blue-600"></i>
          <span id="currencyToggleLabel">USD로 보기</span>
        </button>

        <button onclick="openApiKeyModal()" class="w-8 h-8 rounded-full bg-white text-gray-600 border border-gray-200 flex items-center justify-center text-sm hover:bg-gray-100 active:scale-95 transition shadow-xs shrink-0" title="Finnhub API 설정">
          <i class="ph ph-key"></i>
        </button>

        <button onclick="openBackupModal()" class="w-8 h-8 rounded-full bg-white text-gray-600 border border-gray-200 flex items-center justify-center text-base hover:bg-gray-100 active:scale-95 transition shadow-xs shrink-0" title="데이터 백업 및 복원">
          <i class="ph ph-floppy-disk"></i>
        </button>
      </div>
    </header>

    <!-- 기준 시점 설정 바 -->
    <div class="bg-gray-100/90 px-4 sm:px-6 py-2 flex flex-wrap items-center justify-between gap-2 text-xs border-b border-gray-200">
      <div class="flex items-center gap-1.5 text-gray-700 font-semibold flex-wrap">
        <i class="ph ph-calendar text-sm text-blue-600 shrink-0"></i>
        <span class="whitespace-nowrap">기준 시점:</span>
        <input type="date" id="asOfDateInput" onchange="handleAsOfDateChange(this.value)" class="bg-white border border-gray-300 rounded-lg px-2 py-0.5 text-xs text-gray-800 font-bold outline-none focus:border-blue-500">
      </div>
      <button onclick="resetAsOfDate()" id="asOfResetBtn" class="hidden text-[11px] font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 px-2 py-0.5 rounded-full transition whitespace-nowrap">
        오늘로 복귀
      </button>
    </div>

    <!-- 실시간 상태 및 환율 바 -->
    <div class="bg-white/90 px-4 sm:px-6 py-2 flex flex-wrap items-center justify-between gap-2 text-xs text-gray-600 border-b border-gray-100">
      <div class="flex items-center gap-1.5 flex-wrap">
        <span id="wsStatusBadge" class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-600 whitespace-nowrap">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1 animate-ping"></span>
          연동 ON
        </span>
        <span id="marketStatusText" class="text-[11px] text-gray-500 font-medium whitespace-nowrap">시세 수신 중</span>
      </div>
      <button onclick="promptExchangeRate()" class="flex items-center gap-1 hover:text-blue-600 font-semibold text-gray-600 transition whitespace-nowrap">
        <span>적용 환율:</span>
        <span id="rateLabel" class="text-[#191f28] font-bold">1,347원</span>
        <i class="ph ph-pencil-simple text-[11px]"></i>
      </button>
    </div>

    <!-- 네비게이션 탭 -->
    <div class="px-4 sm:px-6 pt-3">
      <div class="flex bg-gray-200/80 p-1 rounded-2xl text-xs font-bold text-gray-500 w-full max-w-md mx-auto sm:mx-0">
        <button id="navTabDashboard" class="flex-1 py-2 rounded-xl bg-white text-gray-900 shadow-xs transition whitespace-nowrap" onclick="switchNavTab('dashboard')">
          대시보드
        </button>
        <button id="navTabAnalysis" class="flex-1 py-2 rounded-xl hover:text-gray-900 transition whitespace-nowrap" onclick="switchNavTab('analysis')">
          비중·판매수익
        </button>
        <button id="navTabHistory" class="flex-1 py-2 rounded-xl hover:text-gray-900 transition whitespace-nowrap" onclick="switchNavTab('history')">
          거래·입출금 내역
        </button>
      </div>
    </div>

    <!-- [섹션 1] 대시보드 뷰 -->
    <main id="viewDashboard" class="px-4 sm:px-6 space-y-4 flex-1 mt-3">

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
        <!-- 요약 카드 -->
        <section class="lg:col-span-5 bg-white rounded-3xl p-5 sm:p-6 shadow-xs border border-gray-100 relative flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between text-gray-500 text-sm font-medium">
              <div class="flex items-center gap-1.5">
                <span>내 총 자산</span>
              </div>
              <button onclick="refreshActualQuotes()" class="text-gray-400 hover:text-gray-700 transition active:rotate-180 duration-500" title="실제 종가 즉시 동기화">
                <i class="ph ph-arrows-clockwise text-lg"></i>
              </button>
            </div>

            <div class="mt-2.5">
              <h2 id="totalAssetDisplay" class="text-2xl sm:text-[32px] font-extrabold tracking-tight text-[#191f28] break-all">
                0원
              </h2>
              <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                <span class="text-xs text-gray-400 font-medium">평가손익</span>
                <span id="totalProfitAmountDisplay" class="text-base font-extrabold color-up whitespace-nowrap">+0원</span>
                <span id="totalProfitRateBadge" class="text-xs font-bold px-2 py-0.5 rounded-full bg-up-light color-up whitespace-nowrap">+0.00%</span>
              </div>
            </div>
          </div>

          <div class="mt-5 pt-4 border-t border-gray-100 flex items-center justify-between text-xs gap-2">
            <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap min-w-0">
              <span class="w-6 h-6 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-xs shrink-0">$</span>
              <span class="text-gray-500 font-medium whitespace-nowrap">달러 예수금</span>
              <strong id="usdCashDisplay" class="text-gray-900 font-bold text-sm whitespace-nowrap">$0.00</strong>
              <span id="usdCashKrwSub" class="text-[11px] text-gray-400 font-normal whitespace-nowrap">(0원)</span>
            </div>
            <button onclick="openCashModal('DEPOSIT')" class="text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full font-bold hover:bg-blue-100 active:scale-95 transition shrink-0 whitespace-nowrap">
              입출금 관리
            </button>
          </div>
        </section>

        <!-- 자산 추이 차트 카드 -->
        <section class="lg:col-span-7 bg-white rounded-3xl p-5 shadow-xs border border-gray-100 relative flex flex-col justify-between">
          <div class="flex bg-gray-100/90 p-1 rounded-2xl mb-3 text-xs font-bold text-gray-500">
            <button class="flex-1 py-1.5 rounded-xl bg-white text-gray-900 shadow-xs transition whitespace-nowrap" onclick="selectPeriod('1M', this)">1개월</button>
            <button class="flex-1 py-1.5 rounded-xl hover:text-gray-900 transition whitespace-nowrap" onclick="selectPeriod('3M', this)">3개월</button>
            <button class="flex-1 py-1.5 rounded-xl hover:text-gray-900 transition whitespace-nowrap" onclick="selectPeriod('6M', this)">6개월</button>
            <button class="flex-1 py-1.5 rounded-xl hover:text-gray-900 transition whitespace-nowrap" onclick="selectPeriod('ALL', this)">전체</button>
          </div>

          <div class="h-48 w-full relative mt-2">
            <div id="chartCustomTooltip" class="hidden bg-[#191f28] text-white px-3.5 py-2 rounded-2xl shadow-xl border border-gray-700 min-w-[110px] text-center">
              <p id="tooltipDate" class="text-[11px] text-gray-300 font-medium">-</p>
              <p id="tooltipValue" class="text-sm font-extrabold text-white mt-0.5 tracking-tight">0원</p>
            </div>
            <canvas id="trendChart"></canvas>
          </div>

          <div class="flex items-center justify-between text-[11px] text-gray-400 mt-2 pt-2 border-t border-gray-50 gap-1 flex-wrap">
            <span id="chartStartDateLabel" class="whitespace-nowrap">-</span>
            <div class="flex items-center gap-1.5 text-blue-600 font-semibold whitespace-nowrap">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
              <span id="chartLegendCaption">합산 자산 추이 (원화 환산)</span>
            </div>
            <span id="chartEndDateLabel" class="whitespace-nowrap">오늘</span>
          </div>
        </section>
      </div>

      <!-- 보유 주식 헤더 & 정렬 바 -->
      <div class="flex items-center justify-between pt-2 px-1 flex-wrap gap-2">
        <div class="flex items-center gap-2">
          <h3 class="font-bold text-lg text-gray-900 whitespace-nowrap">보유 주식</h3>
          <span id="holdingStockCountBadge" class="bg-gray-200 text-gray-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
          <button id="feeToggleBtn" onclick="toggleFeeMode()" class="flex items-center gap-1 bg-white border border-gray-200 px-2 py-1 rounded-full text-[11px] font-bold text-gray-600 shadow-xs hover:bg-gray-50 active:scale-95 transition whitespace-nowrap">
            <i class="ph ph-receipt text-xs"></i>
            <span id="feeToggleLabel">수수료</span>
          </button>
        </div>
        
        <div class="flex items-center gap-2">
          <select id="sortSelect" onchange="handleSortChange(this.value)" class="text-xs bg-white border border-gray-200 text-gray-700 font-semibold rounded-full px-2.5 py-1 outline-none shadow-xs">
            <option value="val_desc">평가금액 높은순</option>
            <option value="val_asc">평가금액 낮은순</option>
            <option value="rate_desc">수익률 높은순</option>
            <option value="rate_asc">수익률 낮은순</option>
          </select>

          <button onclick="openTradeModal('BUY')" class="text-xs font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-full transition flex items-center gap-1 active:scale-95 whitespace-nowrap">
            <i class="ph ph-plus-bold"></i> 거래 등록
          </button>
        </div>
      </div>

      <div id="holdingStockList" class="grid grid-cols-1 md:grid-cols-2 gap-3 pb-6"></div>
    </main>

    <!-- [섹션 2] 포트폴리오 비중 & 판매수익 뷰 -->
    <section id="viewAnalysis" class="px-4 sm:px-6 space-y-4 flex-1 mt-3 hidden">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

        <div class="lg:col-span-7 bg-white rounded-3xl p-5 sm:p-6 shadow-xs border border-gray-100 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="font-bold text-base text-gray-900">판매수익 (실현손익)</h3>
              <p class="text-xs text-gray-400 mt-0.5">매도 완료된 주식의 실현 순이익입니다.</p>
            </div>
          </div>

          <div class="flex bg-gray-100/90 p-1 rounded-2xl text-xs font-bold text-gray-500">
            <button id="saleModeDay" class="flex-1 py-1.5 rounded-xl hover:text-gray-900 transition whitespace-nowrap" onclick="changeSaleProfitMode('DAY')">일</button>
            <button id="saleModeMonth" class="flex-1 py-1.5 rounded-xl bg-white text-gray-900 shadow-xs transition whitespace-nowrap" onclick="changeSaleProfitMode('MONTH')">월</button>
            <button id="saleModeYear" class="flex-1 py-1.5 rounded-xl hover:text-gray-900 transition whitespace-nowrap" onclick="changeSaleProfitMode('YEAR')">연</button>
            <button id="saleModeAll" class="flex-1 py-1.5 rounded-xl hover:text-gray-900 transition whitespace-nowrap" onclick="changeSaleProfitMode('ALL')">전체</button>
          </div>

          <div class="flex items-center justify-between bg-gray-50 px-4 py-2.5 rounded-2xl border border-gray-100">
            <button id="btnSalePrev" onclick="navigateSalePeriod(-1)" class="w-8 h-8 rounded-full bg-white text-gray-600 hover:text-gray-900 flex items-center justify-center shadow-xs active:scale-90 transition shrink-0">
              <i class="ph ph-caret-left-bold text-base"></i>
            </button>
            
            <div class="text-center px-2">
              <span id="salePeriodTitle" class="font-extrabold text-sm text-gray-900 whitespace-nowrap">-</span>
              <span id="salePeriodSub" class="block text-[10px] text-gray-400 font-medium whitespace-nowrap">선택된 기간</span>
            </div>

            <button id="btnSaleNext" onclick="navigateSalePeriod(1)" class="w-8 h-8 rounded-full bg-white text-gray-600 hover:text-gray-900 flex items-center justify-center shadow-xs active:scale-90 transition shrink-0">
              <i class="ph ph-caret-right-bold text-base"></i>
            </button>
          </div>

          <div class="relative">
            <input type="text" id="saleSearchInput" oninput="handleSaleSearch(this.value)" placeholder="판매수익 검색 (종목명, 티커)" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-9 pr-8 py-2 text-xs text-gray-800 outline-none focus:border-blue-500 focus:bg-white transition shadow-2xs">
            <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i>
            <button onclick="clearSaleSearch()" id="saleSearchClearBtn" class="hidden absolute right-2.5 top-2 text-gray-400 hover:text-gray-600">
              <i class="ph ph-x-circle-fill text-base"></i>
            </button>
          </div>

          <div class="p-4 rounded-2xl bg-gradient-to-br from-gray-50 to-blue-50/30 border border-gray-100 flex items-center justify-between gap-2 flex-wrap">
            <div>
              <span class="text-xs text-gray-400 font-medium whitespace-nowrap">실현 손익 합계 (순수익)</span>
              <h4 id="saleTotalProfitAmount" class="text-2xl font-extrabold color-up mt-0.5 break-all">+0원</h4>
            </div>
            <div class="text-right">
              <span class="text-xs text-gray-400 font-medium whitespace-nowrap">수익률</span>
              <div class="mt-0.5">
                <span id="saleTotalProfitRate" class="text-sm font-extrabold px-2.5 py-1 rounded-xl bg-up-light color-up whitespace-nowrap">+0.00%</span>
              </div>
            </div>
          </div>

          <div class="space-y-2 pt-1">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-gray-600 whitespace-nowrap">매도 내역 (<span id="saleItemCount">0</span>)</span>
            </div>
            <div id="saleItemList" class="space-y-2"></div>
          </div>
        </div>

        <div class="lg:col-span-5 bg-white rounded-3xl p-5 sm:p-6 shadow-xs border border-gray-100 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-1">
              <h3 class="font-bold text-base text-gray-900">포트폴리오 자산 비중</h3>
            </div>
            <p class="text-xs text-gray-400 mb-4">보유 주식 및 달러 현금의 자산 구성 비율입니다.</p>
            
            <div class="h-52 w-full relative flex items-center justify-center">
              <canvas id="doughnutChart"></canvas>
            </div>
          </div>

          <div id="doughnutLegend" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-4 pt-4 border-t border-gray-100 text-xs"></div>
        </div>

      </div>
    </section>

    <!-- [섹션 3] 거래 내역 & 입출금 내역 뷰 -->
    <section id="viewHistory" class="px-4 sm:px-6 space-y-4 flex-1 mt-3 hidden">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div class="flex gap-2 flex-wrap">
          <button id="subTabTrades" onclick="switchHistorySubTab('trades')" class="text-xs font-bold px-3 py-1.5 rounded-full bg-[#191f28] text-white whitespace-nowrap">
            주식 매매 내역 (<span id="tradeCountLabel">0</span>)
          </button>
          <button id="subTabCash" onclick="switchHistorySubTab('cash')" class="text-xs font-bold px-3 py-1.5 rounded-full bg-white text-gray-600 border border-gray-200 whitespace-nowrap">
            달러 입출금 내역 (<span id="cashCountLabel">0</span>)
          </button>
        </div>

        <button onclick="openCurrentActionModal()" class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1.5 rounded-full hover:bg-blue-100 transition active:scale-95 whitespace-nowrap">
          + 내역 등록
        </button>
      </div>

      <div class="relative">
        <input type="text" id="historySearchInput" oninput="handleHistorySearch(this.value)" placeholder="내역 검색" class="w-full bg-white border border-gray-200 rounded-2xl pl-9 pr-8 py-2.5 text-xs text-gray-800 outline-none focus:border-blue-500 transition shadow-2xs">
        <i class="ph ph-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
        <button onclick="clearHistorySearch()" id="historySearchClearBtn" class="hidden absolute right-3 top-2.5 text-gray-400 hover:text-gray-600">
          <i class="ph ph-x-circle-fill text-base"></i>
        </button>
      </div>

      <div id="tradeHistoryList" class="grid grid-cols-1 md:grid-cols-2 gap-2.5 pb-6"></div>
      <div id="cashHistoryList" class="grid grid-cols-1 md:grid-cols-2 gap-2.5 pb-6 hidden"></div>
    </section>

    <!-- 모달 창들 -->
    <div id="tradeModal" class="fixed inset-0 bg-black/50 z-50 backdrop-blur-xs flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
      <div class="bg-white w-full max-w-[440px] rounded-t-3xl sm:rounded-3xl p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center">
          <h4 id="tradeModalTitle" class="text-lg font-bold text-gray-900">주식 거래 등록</h4>
          <button onclick="closeModal('tradeModal')" class="text-gray-400 hover:text-gray-600 text-xl font-bold p-1"><i class="ph ph-x"></i></button>
        </div>
        <form id="tradeForm" onsubmit="handleTradeSubmit(event)" class="space-y-3 text-sm">
          <input type="hidden" id="editTradeId" value="">
          <div class="grid grid-cols-2 gap-2 bg-gray-100 p-1 rounded-xl text-xs font-bold">
            <button type="button" id="btnTypeBuy" onclick="setTradeType('BUY')" class="py-2 rounded-lg bg-red-500 text-white shadow-xs">매수 (Buy)</button>
            <button type="button" id="btnTypeSell" onclick="setTradeType('SELL')" class="py-2 rounded-lg text-gray-600">매도 (Sell)</button>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">티커 심볼 (Ticker)</label>
            <input id="inputTradeSymbol" type="text" placeholder="예: AAPL, OKLO" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 uppercase font-mono font-bold text-gray-800 outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">종목 표시명</label>
            <input id="inputTradeName" type="text" placeholder="예: 애플, 오클로" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 text-gray-800 outline-none focus:border-blue-500">
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">체결 수량 (주)</label>
              <input id="inputTradeShares" type="number" step="any" min="0.0001" placeholder="10" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 text-gray-800 outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">체결 단가 ($ USD)</label>

  <script>
    const STORAGE_KEY_TRADES = "TOSS_APP_TRADES_V2";
    const STORAGE_KEY_CASH = "TOSS_APP_CASH_V2";
    const STORAGE_KEY_API = "FINNHUB_API_KEY";
    const STORAGE_KEY_RATE = "EXCHANGE_RATE";
    const STORAGE_KEY_CURRENCY = "DISPLAY_CURRENCY";
    const STORAGE_KEY_HOLDING_FEE = "APPLY_HOLDING_FEE_MODE";
    const STORAGE_KEY_HISTORICAL_CACHE = "HISTORICAL_PRICE_CACHE_V1";

    let finnhubKey = localStorage.getItem(STORAGE_KEY_API) || 'sandbox_c0123456789';
    let exchangeRate = parseFloat(localStorage.getItem(STORAGE_KEY_RATE)) || 1347.0;
    let displayCurrency = localStorage.getItem(STORAGE_KEY_CURRENCY) || 'KRW';
    let applyHoldingFee = localStorage.getItem(STORAGE_KEY_HOLDING_FEE) !== 'false';
    let currentSortMode = 'val_desc';
    let activeNavTab = 'dashboard';
    let activeHistorySubTab = 'trades';

    let selectedAsOfDate = null;
    let saleProfitMode = 'MONTH';
    let saleCurrentAnchorDate = new Date();
    let saleSearchKeyword = '';
    let historySearchKeyword = '';

    let trades = JSON.parse(localStorage.getItem(STORAGE_KEY_TRADES)) || [
      { id: "trade-1", type: "BUY", symbol: "OKLO", name: "오클로", shares: 100, price: 142.95, date: "2026-09-09T10:00:00" },
      { id: "trade-2", type: "BUY", symbol: "AAPL", name: "애플", shares: 15, price: 82.50, date: "2024-03-01T10:30:00" }
    ];

    let cashTransactions = JSON.parse(localStorage.getItem(STORAGE_KEY_CASH)) || [
      { id: "cash-1", type: "DEPOSIT", amount: 25000.00, memo: "초기 달러 예수금", date: "2024-01-01T09:00:00" }
    ];

    let quotePrices = { "OKLO": 150.00, "AAPL": 220.00, "NVDA": 120.00, "TSLA": 240.00 };
    let historicalPriceCache = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORICAL_CACHE)) || {};

    let socket = null;
    let trendChart = null;
    let doughnutChart = null;
    let currentTradeType = 'BUY';
    let currentCashType = 'DEPOSIT';

    function formatDateKey(dateObj) {
      if (!(dateObj instanceof Date) || isNaN(dateObj)) return "";
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function sanitizeHistoricalCache(rawCache) {
      if (!rawCache || typeof rawCache !== 'object') return {};
      const cleanCache = {};
      Object.keys(rawCache).forEach(sym => {
        const uppercaseSym = sym.toUpperCase();
        cleanCache[uppercaseSym] = {};
        const datesMap = rawCache[sym];
        if (datesMap && typeof datesMap === 'object') {
          Object.keys(datesMap).forEach(dKey => {
            const normalizedKey = dKey.replace(/[\.\/]/g, '-');
            const val = Number(datesMap[dKey]);
            if (!isNaN(val) && val > 0) {
              cleanCache[uppercaseSym][normalizedKey] = val;
            }
          });
        }
      });
      return cleanCache;
    }

    // 깃허브 액션으로 자동 생성되는 historical_prices.json 연동 (실패 시 로컬 계산/캐시 사용)
    async function loadRemoteHistoricalPrices() {
      try {
        const res = await fetch('./historical_prices.json');
        if (res.ok) {
          const remoteCache = await res.json();
          if (remoteCache) {
            historicalPriceCache = sanitizeHistoricalCache({
              ...historicalPriceCache,
              ...remoteCache
            });
            localStorage.setItem(STORAGE_KEY_HISTORICAL_CACHE, JSON.stringify(historicalPriceCache));
          }
        }
      } catch (e) {
        console.log("외부 JSON 파일 연동 대기 중 (오프라인/로컬 모드)");
      }
      renderAll();
      updateTrendChart();
    }

    function getEffectiveCutoffDate() {
      if (selectedAsOfDate) {
        const parts = selectedAsOfDate.split('-');
        return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 23, 59, 59, 999);
      }
      return new Date();
    }

    function isAsOfMode() {
      if (!selectedAsOfDate) return false;
      return selectedAsOfDate < formatDateKey(new Date());
    }

    function handleAsOfDateChange(val) {
      selectedAsOfDate = val || null;
      updateAsOfUI();
      renderAll();
      updateTrendChart();
    }

    function resetAsOfDate() {
      selectedAsOfDate = formatDateKey(new Date());
      document.getElementById('asOfDateInput').value = selectedAsOfDate;
      updateAsOfUI();
      renderAll();
      updateTrendChart();
    }

    function updateAsOfUI() {
      const resetBtn = document.getElementById('asOfResetBtn');
      if (selectedAsOfDate && selectedAsOfDate !== formatDateKey(new Date())) {
        resetBtn.classList.remove('hidden');
      } else {
        resetBtn.classList.add('hidden');
      }
    }

    function calcTossBuyFee(grossAmountUsd) { return Math.round(grossAmountUsd * 0.001 * 100) / 100; }
    function calcTossSellFeeComponents(grossAmountUsd) {
      const commission = Math.round(grossAmountUsd * 0.001 * 100) / 100;
      const rawSec = grossAmountUsd * 0.0000278;
      const secTax = rawSec > 0 ? Math.max(0.01, Math.round(rawSec * 100) / 100) : 0;
      return { commission, secTax, totalFees: commission + secTax };
    }
    function calcTossSellFee(grossAmountUsd) { return calcTossSellFeeComponents(grossAmountUsd).totalFees; }

    function computeCashUsd() {
      let total = 0;
      const cutoffTime = getEffectiveCutoffDate().getTime();
      cashTransactions.forEach(c => {
        if (new Date(c.date).getTime() <= cutoffTime) {
          if (c.type === 'DEPOSIT') total += Number(c.amount);
          else if (c.type === 'WITHDRAW') total -= Number(c.amount);
        }
      });
      trades.forEach(t => {
        if (new Date(t.date).getTime() <= cutoffTime) {
          const gross = Number(t.shares) * Number(t.price);
          if (t.type === 'BUY') total -= (gross + calcTossBuyFee(gross));
          else if (t.type === 'SELL') total += (gross - calcTossSellFee(gross));
        }
      });
      return total;
    }

    function computeHoldings() {
      const map = {};
      const cutoffTime = getEffectiveCutoffDate().getTime();
      const cutoffDate = getEffectiveCutoffDate();

      const sortedTrades = [...trades]
        .filter(t => new Date(t.date).getTime() <= cutoffTime)
        .sort((a, b) => new Date(a.date) - new Date(b.date));

      sortedTrades.forEach(t => {
        const sym = t.symbol.toUpperCase();
        if (!map[sym]) map[sym] = { symbol: sym, name: t.name || sym, shares: 0, totalCostUsd: 0 };
        const gross = Number(t.shares) * Number(t.price);

        if (t.type === 'BUY') {
          map[sym].shares += Number(t.shares);
          map[sym].totalCostUsd += (gross + calcTossBuyFee(gross));
        } else if (t.type === 'SELL') {
          const prevShares = map[sym].shares;
          if (prevShares > 0) {
            const avg = map[sym].totalCostUsd / prevShares;
            map[sym].shares = Math.max(0, prevShares - Number(t.shares));
            map[sym].totalCostUsd = Math.max(0, map[sym].shares * avg);
          }
        }
      });

      const holdings = [];
      Object.keys(map).forEach(sym => {
        const item = map[sym];
        if (item.shares > 0.00001) {
          const avgPrice = item.totalCostUsd / item.shares;
          const currentPrice = getStockCloseOnDate(sym, cutoffDate);
          const rawEvalUsd = item.shares * currentPrice;
          const sellFees = applyHoldingFee ? calcTossSellFee(rawEvalUsd) : 0;
          const evalUsd = Math.max(0, rawEvalUsd - sellFees);
          const profitUsd = evalUsd - item.totalCostUsd;
          const profitRate = item.totalCostUsd > 0 ? (profitUsd / item.totalCostUsd) * 100 : 0;

          holdings.push({ symbol: sym, name: item.name, shares: item.shares, avgPrice, currentPrice, rawEvalUsd, evalUsd, costUsd: item.totalCostUsd, profitUsd, profitRate });
        }
      });

      holdings.sort((a, b) => {
        if (currentSortMode === 'val_desc') return b.evalUsd - a.evalUsd;
        if (currentSortMode === 'val_asc') return a.evalUsd - b.evalUsd;
        if (currentSortMode === 'rate_desc') return b.profitRate - a.profitRate;
        if (currentSortMode === 'rate_asc') return a.profitRate - b.profitRate;
        return 0;
      });

      return holdings;
    }

    function calculateRealizedProfits() {
      const cutoffTime = getEffectiveCutoffDate().getTime();
      const sortedTrades = [...trades]
        .filter(t => new Date(t.date).getTime() <= cutoffTime)
        .sort((a, b) => new Date(a.date) - new Date(b.date));
      const pool = {};
      const sales = [];

      sortedTrades.forEach(t => {
        const sym = t.symbol.toUpperCase();
        if (!pool[sym]) pool[sym] = { shares: 0, costUsd: 0 };
        const gross = Number(t.shares) * Number(t.price);

        if (t.type === 'BUY') {
          pool[sym].shares += Number(t.shares);
          pool[sym].costUsd += (gross + calcTossBuyFee(gross));
        } else if (t.type === 'SELL') {
          const sellShares = Number(t.shares);
          const prevShares = pool[sym].shares;
          const avgCostPerShare = prevShares > 0 ? (pool[sym].costUsd / prevShares) : Number(t.price);

          const costBasis = sellShares * avgCostPerShare;
          const feePack = calcTossSellFeeComponents(gross);
          const netProceeds = gross - feePack.totalFees;
          const profitUsd = netProceeds - costBasis;
          const profitRate = costBasis > 0 ? (profitUsd / costBasis) * 100 : 0;

          sales.push({ id: t.id, symbol: sym, name: t.name || sym, shares: sellShares, price: Number(t.price), date: t.date, netProceeds, costBasis, profitUsd, profitRate });

          pool[sym].shares = Math.max(0, prevShares - sellShares);
          pool[sym].costUsd = Math.max(0, pool[sym].shares * avgCostPerShare);
        }
      });

      return sales;
    }

    function changeSaleProfitMode(mode) {
      saleProfitMode = mode;
      ['Day', 'Month', 'Year', 'All'].forEach(m => {
        const btn = document.getElementById(`saleMode${m}`);
        btn.className = m.toUpperCase() === mode
          ? "flex-1 py-1.5 rounded-xl bg-white text-gray-900 shadow-xs transition font-bold whitespace-nowrap"
          : "flex-1 py-1.5 rounded-xl hover:text-gray-900 transition font-bold text-gray-500 whitespace-nowrap";
      });
      renderSaleProfitSection();
    }

    function navigateSalePeriod(direction) {
      if (saleProfitMode === 'ALL') return;
      const d = new Date(saleCurrentAnchorDate);
      if (saleProfitMode === 'DAY') d.setDate(d.getDate() + direction);
      else if (saleProfitMode === 'MONTH') d.setMonth(d.getMonth() + direction);
      else if (saleProfitMode === 'YEAR') d.setFullYear(d.getFullYear() + direction);
      saleCurrentAnchorDate = d;
      renderSaleProfitSection();
    }

    function handleSaleSearch(val) {
      saleSearchKeyword = val.trim().toLowerCase();
      document.getElementById('saleSearchClearBtn').classList.toggle('hidden', saleSearchKeyword === '');
      renderSaleProfitSection();
    }

    function clearSaleSearch() {
      saleSearchKeyword = '';
      document.getElementById('saleSearchInput').value = '';
      document.getElementById('saleSearchClearBtn').classList.add('hidden');
      renderSaleProfitSection();
    }

    function renderSaleProfitSection() {
      const anchor = new Date(saleCurrentAnchorDate);
      let startDate, endDate, periodTitleText, periodSubText;
      const y = anchor.getFullYear(), m = anchor.getMonth(), d = anchor.getDate();

      if (saleProfitMode === 'DAY') {
        startDate = new Date(y, m, d, 0, 0, 0); endDate = new Date(y, m, d, 23, 59, 59, 999);
        periodTitleText = `${y}년 ${m + 1}월 ${d}일`; periodSubText = "선택된 날짜 기준 실현 순손익";
      } else if (saleProfitMode === 'MONTH') {
        startDate = new Date(y, m, 1, 0, 0, 0); endDate = new Date(y, m + 1, 0, 23, 59, 59, 999);
        periodTitleText = `${y}년 ${m + 1}월`; periodSubText = "해당 월 누적 실현 순손익";
      } else if (saleProfitMode === 'YEAR') {
        startDate = new Date(y, 0, 1, 0, 0, 0); endDate = new Date(y, 11, 31, 23, 59, 59, 999);
        periodTitleText = `${y}년`; periodSubText = "연간 누적 실현 순손익";
      } else {
        startDate = new Date(0); endDate = new Date(8640000000000000);
        periodTitleText = "전체 기간"; periodSubText = "계좌 총 누적 실현 순손익";
      }

      document.getElementById('salePeriodTitle').textContent = periodTitleText;
      document.getElementById('salePeriodSub').textContent = periodSubText;

      let filteredSales = calculateRealizedProfits().filter(s => {
        const tTime = new Date(s.date).getTime();
        return tTime >= startDate.getTime() && tTime <= endDate.getTime();
      });

      if (saleSearchKeyword) {
        filteredSales = filteredSales.filter(s => s.name.toLowerCase().includes(saleSearchKeyword) || s.symbol.toLowerCase().includes(saleSearchKeyword));
      }

      document.getElementById('saleItemCount').textContent = filteredSales.length;

      let sumProfitUsd = 0, sumCostBasisUsd = 0;
      filteredSales.forEach(s => { sumProfitUsd += s.profitUsd; sumCostBasisUsd += s.costBasis; });

      const overallRate = sumCostBasisUsd > 0 ? (sumProfitUsd / sumCostBasisUsd) * 100 : 0;
      const isUp = sumProfitUsd >= 0;
      const sign = isUp ? '+' : '';

      const totalAmountEl = document.getElementById('saleTotalProfitAmount');
      totalAmountEl.className = `text-2xl font-extrabold ${isUp ? 'color-up' : 'color-down'} mt-0.5 break-all`;
      totalAmountEl.textContent = `${sign}${formatMoney(sumProfitUsd)}`;

      const totalRateEl = document.getElementById('saleTotalProfitRate');
      totalRateEl.className = `text-sm font-extrabold px-2.5 py-1 rounded-xl ${isUp ? 'bg-up-light text-[#f04452]' : 'bg-down-light text-[#3182f6]'} whitespace-nowrap`;
      totalRateEl.textContent = `${sign}${overallRate.toFixed(2)}%`;

      const listEl = document.getElementById('saleItemList');
      listEl.innerHTML = '';

      if (filteredSales.length === 0) {
        listEl.innerHTML = `<div class="p-6 rounded-2xl bg-gray-50 text-center text-xs text-gray-400 border border-gray-100">매도 내역이 없습니다.</div>`;
        return;
      }

      filteredSales.slice().reverse().forEach(s => {
        const itemUp = s.profitUsd >= 0;
        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-3.5 rounded-2xl bg-gray-50 border border-gray-100 hover:bg-blue-50/40 cursor-pointer transition gap-2";
        row.onclick = () => openEditTradeModal(s.id);
        row.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-9 h-9 rounded-xl bg-blue-100/60 text-blue-600 flex items-center justify-center font-bold text-xs shrink-0">${s.symbol.slice(0, 2)}</div>
            <div class="min-w-0">
              <span class="font-bold text-gray-900 text-xs truncate">${s.name}</span>
              <p class="text-[11px] text-gray-500 mt-0.5">${s.shares}주 매도 · 단가 $${s.price.toFixed(2)}</p>
            </div>
          </div>
          <div class="text-right shrink-0">
            <p class="font-extrabold text-xs ${itemUp ? 'color-up' : 'color-down'}">${itemUp ? '+' : ''}${formatMoney(s.profitUsd)}</p>
          </div>
        `;
        listEl.appendChild(row);
      });
    }

    function initFinnhubSocket() {
      if (socket) { try { socket.close(); } catch(e){} }
      try {
        socket = new WebSocket(`wss://ws.finnhub.io?token=${finnhubKey}`);
        socket.onopen = () => {
          computeHoldings().forEach(h => socket.send(JSON.stringify({ type: 'subscribe', symbol: h.symbol })));
        };
        socket.onmessage = (e) => {
          const res = JSON.parse(e.data);
          if (res.type === 'trade' && Array.isArray(res.data)) {
            res.data.forEach(t => { if (t.s && t.p > 0) quotePrices[t.s] = Number(t.p); });
            renderAll();
            updateTrendChart();
          }
        };
      } catch (err) {}
    }

    async function refreshActualQuotes() {
      const holdings = computeHoldings();
      await Promise.all(holdings.map(async (h) => {
        try {
          const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${h.symbol}&token=${finnhubKey}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.c > 0) quotePrices[h.symbol] = Number(data.c);
          }
        } catch (e) {}
      }));
      renderAll();
      updateTrendChart();
    }

    function formatMoney(usdAmount, isKrwForce = false) {
      if (displayCurrency === 'KRW' || isKrwForce) {
        return `${Math.round(usdAmount * exchangeRate).toLocaleString()}원`;
      }
      return `$${usdAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

    function renderDashboardHeader() {
      const cutoffTime = getEffectiveCutoffDate().getTime();
      const cutoffDate = getEffectiveCutoffDate();

      const sortedTrades = [...trades].filter(t => new Date(t.date).getTime() <= cutoffTime).sort((a, b) => new Date(a.date) - new Date(b.date));
      const map = {};

      sortedTrades.forEach(t => {
        const sym = t.symbol.toUpperCase();
        if (!map[sym]) map[sym] = { shares: 0, totalCostUsd: 0 };
        const gross = Number(t.shares) * Number(t.price);
        if (t.type === 'BUY') {
          map[sym].shares += Number(t.shares);
          map[sym].totalCostUsd += (gross + calcTossBuyFee(gross));
        } else if (t.type === 'SELL') {
          const prev = map[sym].shares;
          if (prev > 0) {
            const avg = map[sym].totalCostUsd / prev;
            map[sym].shares = Math.max(0, prev - Number(t.shares));
            map[sym].totalCostUsd = Math.max(0, map[sym].shares * avg);
          }
        }
      });

      let totalStockEvalUsd = 0, totalStockCostUsd = 0;
      Object.keys(map).forEach(sym => {
        const item = map[sym];
        if (item.shares > 0.00001) {
          const curPrice = getStockCloseOnDate(sym, cutoffDate);
          const rawVal = item.shares * curPrice;
          totalStockEvalUsd += Math.max(0, rawVal - calcTossSellFee(rawVal));
          totalStockCostUsd += item.totalCostUsd;
        }
      });

      const cashUsd = computeCashUsd();
      const totalAssetUsd = totalStockEvalUsd + cashUsd;
      const totalProfitUsd = totalStockEvalUsd - totalStockCostUsd;
      const totalProfitRate = totalStockCostUsd > 0 ? (totalProfitUsd / totalStockCostUsd) * 100 : 0;

      document.getElementById('totalAssetDisplay').textContent = formatMoney(totalAssetUsd);

      const isUp = totalProfitUsd >= 0;
      const sign = isUp ? '+' : '';

      const amountEl = document.getElementById('totalProfitAmountDisplay');
      amountEl.className = `text-base font-extrabold ${isUp ? 'color-up' : 'color-down'} whitespace-nowrap`;
      amountEl.textContent = `${sign}${formatMoney(totalProfitUsd)}`;

      const badgeEl = document.getElementById('totalProfitRateBadge');
      badgeEl.className = `text-xs font-bold px-2 py-0.5 rounded-full ${isUp ? 'bg-up-light text-[#f04452]' : 'bg-down-light text-[#3182f6]'} whitespace-nowrap`;
      badgeEl.textContent = `${sign}${totalProfitRate.toFixed(2)}%`;

      document.getElementById('usdCashDisplay').textContent = `$${cashUsd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      document.getElementById('usdCashKrwSub').textContent = `(${Math.round(cashUsd * exchangeRate).toLocaleString()}원)`;
      document.getElementById('holdingStockCountBadge').textContent = computeHoldings().length;
    }

    let selectedPeriodKey = '1M';

    // 🔥 일별 종가 정확 조회 엔진 (캐시 ➔ 거래 체결가 ➔ 기본값 순서로 안전 보장)
    function getStockCloseOnDate(symbol, targetDate) {
      const uppercaseSym = symbol.toUpperCase();
      const cache = historicalPriceCache[uppercaseSym] || {};
      const key = formatDateKey(targetDate);
      const todayKey = formatDateKey(new Date());

      if (key === todayKey && quotePrices[uppercaseSym] !== undefined) {
        return quotePrices[uppercaseSym];
      }
      if (cache[key] !== undefined) {
        return Number(cache[key]);
      }

      // 가장 가까운 과거 종가 탐색
      const sortedKeys = Object.keys(cache).filter(k => k <= key).sort((a, b) => (a > b ? -1 : 1));
      if (sortedKeys.length > 0) {
        return Number(cache[sortedKeys[0]]);
      }

      // 캐시가 없으면 당시 체결가 활용
      const targetTime = new Date(targetDate).setHours(23, 59, 59, 999);
      const pastTrades = trades.filter(t => t.symbol.toUpperCase() === uppercaseSym && new Date(t.date).getTime() <= targetTime).sort((a, b) => new Date(b.date) - new Date(a.date));
      if (pastTrades.length > 0) return Number(pastTrades[0].price);

      return quotePrices[uppercaseSym] || 100.0;
    }

    function generateDailyAssetData(periodKey) {
      const effectiveEndDate = getEffectiveCutoffDate();
      const todayYear = effectiveEndDate.getFullYear(), todayMonth = effectiveEndDate.getMonth(), todayDate = effectiveEndDate.getDate();
      let startDate = new Date(todayYear, todayMonth, todayDate);

      if (periodKey === '1M') startDate.setDate(todayDate - 29);
      else if (periodKey === '3M') startDate.setDate(todayDate - 89);
      else if (periodKey === '6M') startDate.setMonth(todayMonth - 6);
      else {
        let earliestTime = effectiveEndDate.getTime();
        trades.forEach(t => { const tm = new Date(t.date).getTime(); if (tm < earliestTime) earliestTime = tm; });
        cashTransactions.forEach(c => { const tm = new Date(c.date).getTime(); if (tm < earliestTime) earliestTime = tm; });
        startDate = new Date(earliestTime);
        startDate.setHours(0, 0, 0, 0);
      }

      const labels = [], dates = [], valuesUsd = [];
      const processedDays = new Set();
      const cur = new Date(startDate.getTime());
      const endBoundary = new Date(todayYear, todayMonth, todayDate, 23, 59, 59, 999);

      while (cur.getTime() <= endBoundary.getTime()) {
        const dateKey = formatDateKey(cur);
        if (!processedDays.has(dateKey)) {
          processedDays.add(dateKey);
          const endOfDayTime = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate(), 23, 59, 59, 999).getTime();

          const m = cur.getMonth() + 1, d = cur.getDate();
          labels.push(`${m}/${d}`);
          dates.push(`${cur.getFullYear()}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);

          let dayCashUsd = 0;
          cashTransactions.forEach(c => {
            if (new Date(c.date).getTime() <= endOfDayTime) {
              if (c.type === 'DEPOSIT') dayCashUsd += Number(c.amount);
              else if (c.type === 'WITHDRAW') dayCashUsd -= Number(c.amount);
            }
          });

          const stockSharesMap = {};
          trades.forEach(t => {
            if (new Date(t.date).getTime() <= endOfDayTime) {
              const sym = t.symbol.toUpperCase();
              if (!stockSharesMap[sym]) stockSharesMap[sym] = 0;
              const gross = Number(t.shares) * Number(t.price);
              if (t.type === 'BUY') {
                stockSharesMap[sym] += Number(t.shares);
                dayCashUsd -= (gross + calcTossBuyFee(gross));
              } else if (t.type === 'SELL') {
                stockSharesMap[sym] = Math.max(0, stockSharesMap[sym] - Number(t.shares));
                dayCashUsd += (gross - calcTossSellFee(gross));
              }
            }
          });

          let dayStockEvalUsd = 0;
          Object.keys(stockSharesMap).forEach(sym => {
            const shares = stockSharesMap[sym];
            if (shares > 0.00001) {
              const rawVal = shares * getStockCloseOnDate(sym, cur);
              dayStockEvalUsd += Math.max(0, rawVal - calcTossSellFee(rawVal));
            }
          });

          const convertedVal = displayCurrency === 'KRW' ? (dayStockEvalUsd + dayCashUsd) * exchangeRate : (dayStockEvalUsd + dayCashUsd);
          valuesUsd.push(convertedVal);
        }
        cur.setDate(cur.getDate() + 1);
        cur.setHours(0, 0, 0, 0);
      }

      return { labels, dates, valuesUsd };
    }

    function initTrendChart() {
      const canvas = document.getElementById('trendChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createLinearGradient(0, 0, 0, 160);
      gradient.addColorStop(0, 'rgba(240, 68, 82, 0.28)');
      gradient.addColorStop(1, 'rgba(255, 255, 255, 0.0)');

      const dataPack = generateDailyAssetData(selectedPeriodKey);
      document.getElementById('chartStartDateLabel').textContent = dataPack.dates[0] || '';
      document.getElementById('chartEndDateLabel').textContent = isAsOfMode() ? `${formatDateKey(getEffectiveCutoffDate())} (기준)` : '오늘';

      trendChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dataPack.labels,
          datasets: [{
            data: dataPack.valuesUsd,
            dates: dataPack.dates,
            borderColor: '#f04452',
            borderWidth: 2.8,
            pointRadius: 0,
            fill: true,
            backgroundColor: gradient,
            tension: 0.25,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: false,
              external: function(context) {
                const tooltipEl = document.getElementById('chartCustomTooltip');
                const tooltipModel = context.tooltip;
                if (tooltipModel.opacity === 0) { tooltipEl.classList.add('hidden'); return; }
                if (tooltipModel.body && context.chart.data.datasets[0].data.length > 0) {
                  const idx = tooltipModel.dataPoints[0].dataIndex;
                  document.getElementById('tooltipDate').textContent = context.chart.data.datasets[0].dates[idx];
                  const rawVal = context.chart.data.datasets[0].data[idx];
                  document.getElementById('tooltipValue').textContent = displayCurrency === 'KRW' ? `${Math.round(rawVal).toLocaleString()}원` : `$${rawVal.toFixed(2)}`;
                }
                tooltipEl.classList.remove('hidden');
                tooltipEl.style.left = tooltipModel.caretX + 'px';
                tooltipEl.style.top = tooltipModel.caretY + 'px';
              }
            }
          },
          scales: { x: { display: false }, y: { display: false } }
        }
      });
    }

    function updateTrendChart() {
      if (!trendChart) return;
      const dataPack = generateDailyAssetData(selectedPeriodKey);
      document.getElementById('chartStartDateLabel').textContent = dataPack.dates[0] || '';
      document.getElementById('chartEndDateLabel').textContent = isAsOfMode() ? `${formatDateKey(getEffectiveCutoffDate())} (기준)` : '오늘';
      trendChart.data.labels = dataPack.labels;
      trendChart.data.datasets[0].data = dataPack.valuesUsd;
      trendChart.data.datasets[0].dates = dataPack.dates;
      trendChart.update();
    }

    function updateDoughnutChart() {
      if (!doughnutChart) return;
      const holdings = computeHoldings();
      const cashUsd = computeCashUsd();
      const labels = [], values = [];
      const legendEl = document.getElementById('doughnutLegend');
      legendEl.innerHTML = '';

      let totalVal = Math.max(0, cashUsd);
      holdings.forEach(h => totalVal += h.evalUsd);

      holdings.forEach(h => { labels.push(h.name); values.push(h.evalUsd); });
      if (cashUsd > 0) { labels.push("달러 예수금"); values.push(cashUsd); }

      doughnutChart.data.labels = labels;
      doughnutChart.data.datasets[0].data = values;
      doughnutChart.update();

      const colors = ['#3182f6', '#f04452', '#ff9f43', '#10b981', '#9b59b6', '#34495e'];
      labels.forEach((name, i) => {
        const val = values[i];
        const pct = totalVal > 0 ? ((val / totalVal) * 100).toFixed(1) : 0;
        const item = document.createElement('div');
        item.className = "flex items-center justify-between p-2 rounded-xl bg-gray-50 border border-gray-100 gap-1";
        item.innerHTML = `
          <div class="flex items-center gap-1.5 min-w-0">
            <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${colors[i % colors.length]}"></span>
            <span class="font-bold text-gray-800 truncate">${name}</span>
          </div>
          <span class="font-extrabold text-gray-900 shrink-0 whitespace-nowrap">${pct}%</span>
        `;
        legendEl.appendChild(item);
      });
    }

        trades: trades,
        cashTransactions: cashTransactions,
        exchangeRate: exchangeRate,
        finnhubKey: finnhubKey,
        applyHoldingFee: applyHoldingFee,
        historicalPriceCache: historicalPriceCache
      };
      const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `stock_portfolio_backup_${new Date().toISOString().slice(0, 10).replace(/-/g, '')}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      closeModal('backupModal');
    }

    function importFromTxtFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed.trades)) trades = parsed.trades;
          if (Array.isArray(parsed.cashTransactions)) cashTransactions = parsed.cashTransactions;
          if (parsed.exchangeRate) exchangeRate = Number(parsed.exchangeRate);
          if (parsed.finnhubKey) finnhubKey = parsed.finnhubKey;
          if (parsed.historicalPriceCache) historicalPriceCache = sanitizeHistoricalCache(parsed.historicalPriceCache);

          localStorage.setItem(STORAGE_KEY_TRADES, JSON.stringify(trades));
          localStorage.setItem(STORAGE_KEY_CASH, JSON.stringify(cashTransactions));
          localStorage.setItem(STORAGE_KEY_RATE, exchangeRate);
          localStorage.setItem(STORAGE_KEY_API, finnhubKey);
          localStorage.setItem(STORAGE_KEY_HISTORICAL_CACHE, JSON.stringify(historicalPriceCache));

          closeModal('backupModal');
          renderAll();
          updateTrendChart();
          alert("백업 파일 복원이 완료되었습니다.");
        } catch (err) {
          alert("백업 파일 읽기 실패");
        }
      };
      reader.readAsText(file);
    }

    function switchNavTab(tab) {
      activeNavTab = tab;
      document.getElementById('viewDashboard').classList.toggle('hidden', tab !== 'dashboard');
      document.getElementById('viewAnalysis').classList.toggle('hidden', tab !== 'analysis');
      document.getElementById('viewHistory').classList.toggle('hidden', tab !== 'history');

      ['Dashboard', 'Analysis', 'History'].forEach(t => {
        const btn = document.getElementById(`navTab${t}`);
        btn.className = t.toLowerCase() === tab 
          ? "flex-1 py-2 rounded-xl bg-white text-gray-900 shadow-xs transition font-bold whitespace-nowrap"
          : "flex-1 py-2 rounded-xl hover:text-gray-900 transition font-bold text-gray-500 whitespace-nowrap";
      });

      if (tab === 'analysis') {
        updateDoughnutChart();
        renderSaleProfitSection();
      }
    }

    function switchHistorySubTab(sub) {
      activeHistorySubTab = sub;
      document.getElementById('tradeHistoryList').classList.toggle('hidden', sub !== 'trades');
      document.getElementById('cashHistoryList').classList.toggle('hidden', sub !== 'cash');

      const btnTrades = document.getElementById('subTabTrades');
      const btnCash = document.getElementById('subTabCash');

      if (sub === 'trades') {
        btnTrades.className = "text-xs font-bold px-3 py-1.5 rounded-full bg-[#191f28] text-white whitespace-nowrap";
        btnCash.className = "text-xs font-bold px-3 py-1.5 rounded-full bg-white text-gray-600 border border-gray-200 whitespace-nowrap";
      } else {
        btnCash.className = "text-xs font-bold px-3 py-1.5 rounded-full bg-[#191f28] text-white whitespace-nowrap";
        btnTrades.className = "text-xs font-bold px-3 py-1.5 rounded-full bg-white text-gray-600 border border-gray-200 whitespace-nowrap";
      }
    }

    function openCurrentActionModal() {
      if (activeHistorySubTab === 'trades') openTradeModal('BUY');
      else openCashModal('DEPOSIT');
    }

    function openTradeModal(type) {
      setTradeType(type || 'BUY');
      document.getElementById('editTradeId').value = '';
      document.getElementById('tradeForm').reset();
      document.getElementById('inputTradeDate').value = new Date().toISOString().slice(0, 16);
      document.getElementById('tradeModal').classList.remove('hidden');
    }

    function setTradeType(type) {
      currentTradeType = type;
      const btnBuy = document.getElementById('btnTypeBuy'), btnSell = document.getElementById('btnTypeSell');
      if (type === 'BUY') {
        btnBuy.className = "py-2 rounded-lg bg-red-500 text-white shadow-xs font-bold";
        btnSell.className = "py-2 rounded-lg text-gray-600 font-bold";
      } else {
        btnSell.className = "py-2 rounded-lg bg-blue-600 text-white shadow-xs font-bold";
        btnBuy.className = "py-2 rounded-lg text-gray-600 font-bold";
      }
    }

    function openCashModal(type) {
      setCashType(type || 'DEPOSIT');
      document.getElementById('editCashId').value = '';
      document.getElementById('cashForm').reset();
      document.getElementById('inputCashDate').value = new Date().toISOString().slice(0, 16);
      document.getElementById('cashModal').classList.remove('hidden');
    }

    function setCashType(type) {
      currentCashType = type;
      const btnDep = document.getElementById('btnCashDeposit'), btnWth = document.getElementById('btnCashWithdraw');
      if (type === 'DEPOSIT') {
        btnDep.className = "py-2 rounded-lg bg-blue-600 text-white shadow-xs font-bold";
        btnWth.className = "py-2 rounded-lg text-gray-600 font-bold";
      } else {
        btnWth.className = "py-2 rounded-lg bg-gray-700 text-white shadow-xs font-bold";
        btnDep.className = "py-2 rounded-lg text-gray-600 font-bold";
      }
    }

    function openApiKeyModal() { document.getElementById('apiKeyModal').classList.remove('hidden'); }
    function openBackupModal() { document.getElementById('backupModal').classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function saveApiKey() {
      const v = document.getElementById('inputApiKey').value.trim();
      if (v) { finnhubKey = v; localStorage.setItem(STORAGE_KEY_API, v); }
      closeModal('apiKeyModal');
      initFinnhubSocket();
      refreshActualQuotes();
    }

    async function handleTradeSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('editTradeId').value;
      const sym = document.getElementById('inputTradeSymbol').value.trim().toUpperCase();
      const name = document.getElementById('inputTradeName').value.trim() || sym;
      const shares = parseFloat(document.getElementById('inputTradeShares').value);
      const price = parseFloat(document.getElementById('inputTradePrice').value);
      const date = document.getElementById('inputTradeDate').value || new Date().toISOString();

      if (editId) {
        const idx = trades.findIndex(t => t.id === editId);
        if (idx !== -1) trades[idx] = { id: editId, type: currentTradeType, symbol: sym, name, shares, price, date };
      } else {
        trades.push({ id: "trade-" + Date.now(), type: currentTradeType, symbol: sym, name, shares, price, date });
      }

      localStorage.setItem(STORAGE_KEY_TRADES, JSON.stringify(trades));
      closeModal('tradeModal');
      renderAll();
      updateTrendChart();
    }

    function handleCashSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('editCashId').value;
      const amount = parseFloat(document.getElementById('inputCashAmount').value);
      const memo = document.getElementById('inputCashMemo').value.trim();
      const date = document.getElementById('inputCashDate').value || new Date().toISOString();

      if (editId) {
        const idx = cashTransactions.findIndex(c => c.id === editId);
        if (idx !== -1) cashTransactions[idx] = { id: editId, type: currentCashType, amount, memo, date };
      } else {
        cashTransactions.push({ id: "cash-" + Date.now(), type: currentCashType, amount, memo, date });
      }

      localStorage.setItem(STORAGE_KEY_CASH, JSON.stringify(cashTransactions));
      closeModal('cashModal');
      renderAll();
      updateTrendChart();
    }

    function renderAll() {
      renderDashboardHeader();
      renderHoldings();
      renderHistoryLists();
      if (activeNavTab === 'analysis') {
        updateDoughnutChart();
        renderSaleProfitSection();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById('currencyToggleLabel').textContent = displayCurrency === 'KRW' ? 'USD로 보기' : '원화로 보기';
      document.getElementById('rateLabel').textContent = `${Math.round(exchangeRate).toLocaleString()}원`;

      historicalPriceCache = sanitizeHistoricalCache(historicalPriceCache);

      const todayStr = formatDateKey(new Date());
      selectedAsOfDate = todayStr;
      if (document.getElementById('asOfDateInput')) {
        document.getElementById('asOfDateInput').value = todayStr;
      }

      updateFeeToggleUI();
      initTrendChart();
      initDoughnutChart();
      renderAll();
      initFinnhubSocket();
      loadRemoteHistoricalPrices();
    });
  </script>
</body>
</html>
