name: Auto Fetch Daily Stock Prices

on:
  schedule:
    # 매일 미국 주식시장 마감 후 (한국시간 오전 7:00 / UTC 22:00) 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

jobs:
  fetch-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Run price collection script
        run: |
          python -c "
          import json, os, datetime
          import yfinance as yf

          json_file = 'historical_prices.json'
          price_data = {}

          if os.path.exists(json_file):
              try:
                  with open(json_file, 'r', encoding='utf-8') as f:
                      price_data = json.load(f)
              except Exception as e:
                  print('Existing JSON read error:', e)

          symbols = ['OKLO', 'AAPL', 'NVDA', 'TSLA', 'MSFT', 'AMZN', 'GOOGL', 'META']

          for symbol in symbols:
              try:
                  ticker = yf.Ticker(symbol)
                  hist = ticker.history(period='1mo')
                  if not hist.empty:
                      if symbol not in price_data:
                          price_data[symbol] = {}
                      for date, row in hist.iterrows():
                          date_str = date.strftime('%Y-%m-%d')
                          close_price = round(float(row['Close']), 4)
                          price_data[symbol][date_str] = close_price
                      print(f'Successfully updated {symbol}')
              except Exception as e:
                  print(f'Failed to fetch {symbol}: {e}')

          with open(json_file, 'w', encoding='utf-8') as f:
              json.dump(price_data, f, ensure_ascii=False, indent=2)
          "

      - name: Commit and Push Updated Prices
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add historical_prices.json
          git commit -m "Auto update stock daily close prices [skip ci]" || exit 0
          git push
